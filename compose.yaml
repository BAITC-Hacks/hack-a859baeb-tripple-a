services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: org_agent
      POSTGRES_USER: org_agent
      POSTGRES_PASSWORD: local_demo_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U org_agent -d org_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://org_agent:local_demo_only@db:5432/org_agent
      STORAGE_DIR: /data/uploads
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  uploads:
